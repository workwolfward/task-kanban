<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Crect x='5' y='6' width='3.2' height='12' rx='1' fill='white'/%3E%3Crect x='10.4' y='6' width='3.2' height='7' rx='1' fill='white'/%3E%3Crect x='15.8' y='6' width='3.2' height='9' rx='1' fill='white' opacity='.75'/%3E%3C/svg%3E"
    />
    <title>TaskFlow · 任务看板</title>
    <script>
      // 在首帧绘制前应用主题，避免深色模式闪白
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var forced = params.get('theme');
          var saved = localStorage.getItem('kanban.theme');
          var dark =
            forced === 'dark' || forced === 'light'
              ? forced === 'dark'
              : saved
                ? saved === 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
